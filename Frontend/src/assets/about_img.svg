<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="aboutbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f8"/>
      <stop offset="100%" stop-color="#ffe4e9"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#aboutbg)"/>

  <!-- love letter -->
  <g transform="translate(70,90) rotate(-8)">
    <rect x="0" y="0" width="260" height="180" rx="8" fill="#ffffff" stroke="#f1c6cf" stroke-width="2"/>
    <path d="M0 0 L130 100 L260 0" fill="none" stroke="#f1c6cf" stroke-width="2"/>
    <circle cx="130" cy="95" r="16" fill="#be123c"/>
    <path d="M130 88 c0-6 -9-6 -9 0 c0 6 9 11 9 11 s9-5 9-11 c0-6 -9-6 -9 0 z" fill="#ffe4e9"/>
  </g>

  <!-- ribbon-wrapped gift box -->
  <g transform="translate(370,80)">
    <rect x="0" y="40" width="220" height="170" rx="10" fill="#f43f5e"/>
    <rect x="0" y="40" width="220" height="170" rx="10" fill="#f43f5e"/>
    <rect x="95" y="40" width="30" height="170" fill="#ffe4e9"/>
    <rect x="0" y="100" width="220" height="26" fill="#ffe4e9"/>
    <path d="M80 40 C 55 0, 90 -20, 110 10 C 118 22, 110 40, 110 40 Z" fill="#ffe4e9"/>
    <path d="M140 40 C 165 0, 130 -20, 110 10 C 102 22, 110 40, 110 40 Z" fill="#ffe4e9"/>
  </g>

  <!-- ring box -->
  <g transform="translate(120,360)">
    <rect x="0" y="20" width="150" height="110" rx="12" fill="#be123c"/>
    <rect x="0" y="20" width="150" height="34" rx="10" fill="#e11d48"/>
    <rect x="35" y="70" width="80" height="50" rx="8" fill="#ffe4e9"/>
    <circle cx="75" cy="90" r="16" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="75" cy="80" r="6" fill="#fde68a"/>
  </g>

  <!-- rose stems -->
  <g transform="translate(330,330)">
    <path d="M20 260 C 5 190, 15 140, 40 110" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M60 260 C 55 180, 60 130, 75 95" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="25" cy="160" rx="15" ry="9" fill="#4d7c0f" transform="rotate(-25 25 160)"/>
    <g transform="translate(38,100)">
      <circle r="24" fill="#be123c"/>
      <circle r="16" fill="#e11d48"/>
      <circle r="8" fill="#fb7185"/>
    </g>
    <g transform="translate(75,88)">
      <circle r="20" fill="#f43f5e"/>
      <circle r="13" fill="#fb7185"/>
      <circle r="6" fill="#ffe4e9"/>
    </g>
  </g>

  <!-- small teddy silhouette -->
  <g transform="translate(500,400)" fill="#d9a066">
    <circle cx="40" cy="30" r="26"/>
    <circle cx="18" cy="8" r="10"/>
    <circle cx="62" cy="8" r="10"/>
    <ellipse cx="40" cy="85" rx="34" ry="40"/>
    <circle cx="8" cy="70" r="12"/>
    <circle cx="72" cy="70" r="12"/>
  </g>

  <!-- scattered hearts -->
  <g fill="#fb7185" opacity="0.7">
    <path d="M600 150 c0-10 -14-10 -14 0 c0 10 14 18 14 18 s14-8 14-18 c0-10 -14-10 -14 0 z"/>
    <path d="M60 560 c0-10 -14-10 -14 0 c0 10 14 18 14 18 s14-8 14-18 c0-10 -14-10 -14 0 z"/>
  </g>
</svg>
